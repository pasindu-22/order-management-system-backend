server:
  port: ${SERVER_PORT:8084}
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
services:
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8081}
